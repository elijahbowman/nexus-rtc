# Local stand-in for the Kubernetes ingress: one host serves the frontend, /api and /ws,
# so the frontend can use same-origin URLs in both setups.
server {
    listen 80;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://nexus-rtc-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://nexus-rtc-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://nexus-rtc-frontend:80;
        proxy_set_header Host $host;
    }
}
