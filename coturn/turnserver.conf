# coturn/turnserver.conf
listening-port=3478
tls-listening-port=5349

# Use long-term credentials (this is the standard and safest way)
lt-cred-mech

# Realm (required when using credentials)
realm=discord-turn

# Log to stdout for Docker
log-file=stdout
verbose

# No CLI
no-cli

# Port range for media
min-port=49152
max-port=49252

# Optional: Enable fingerprint (recommended for WebRTC)
fingerprint

# Define at least one static user (User:Pass)
user=devuser:devpassword

# Network settings for Docker
# Allows the server to listen on all interfaces inside the container
listening-ip=0.0.0.0

# External IP (CRITICAL for Mac/Docker)
# On a local Mac, you can usually omit this or use your local IP. 
# But for a real server, this must be the Public IP.
external-ip=10.0.0.58