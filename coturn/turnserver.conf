# coturn/turnserver.conf
listening-port=3478
tls-listening-port=5349

# Long-term credentials. KNOWN ISSUE (S9): the static user below is also compiled into the frontend
# bundle. Use use-auth-secret + static-auth-secret with short-lived credentials issued by the backend.
lt-cred-mech

# Realm (required when using credentials)
realm=discord-turn

# Log to stdout for Docker
log-file=stdout
verbose

# No CLI
no-cli

# Port range for media
min-port=49152
max-port=49252

# Optional: Enable fingerprint (recommended for WebRTC)
fingerprint

# Static dev user (see S9)
user=devuser:devpassword

# KNOWN ISSUE (S9): no denied-peer-ip rules for private ranges, and no-multicast-peers is not set.

# Network settings for Docker
# Allows the server to listen on all interfaces inside the container
listening-ip=0.0.0.0

# External IP: must be reachable by clients. KNOWN ISSUE (C7): a private LAN IP only works on that LAN.
# On a local Mac, you can usually omit this or use your local IP. 
# But for a real server, this must be the Public IP.
external-ip=10.0.0.58