# coturn/turnserver.conf
listening-port=3478
tls-listening-port=5349

# Use long-term credentials (this is the standard and safest way)
lt-cred-mech

# Realm (required when using credentials)
realm=discord-turn

# Log to stdout for Docker
log-file=stdout
verbose

# No CLI
no-cli

# Port range for media
min-port=49152
max-port=65535

# Optional: Enable fingerprint (recommended for WebRTC)
fingerprint