spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/discord_db
    username: dev
    password: password
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables based on User entity
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

