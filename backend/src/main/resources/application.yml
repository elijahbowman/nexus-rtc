spring:
  # Local defaults; Docker and Kubernetes override these with SPRING_DATASOURCE_* variables.
  datasource:
    url: jdbc:postgresql://localhost:5432/realtime_communication_db
    username: dev
    password: password
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only validates it
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # Convenience for existing local volumes; can hide schema drift in production (B4)

aws:
  access:
    key:
      id: ${AWS_ACCESS_KEY_ID:devuser}
  secret:
    access:
      key: ${AWS_SECRET_ACCESS_KEY:devpassword}
minio:
  url: ${MINIO_URL:http://minio.localhost:9000}
  bucket:
    name: ${MINIO_BUCKET_NAME:nexus-rtc-attachments}

# KNOWN ISSUE (S8): not read anywhere; JwtUtils has its own hardcoded secret
app:
  jwtSecret: yourSecureRandomSecretKeyThatIsAtLeast32CharactersLong!!
  jwtExpirationMs: 86400000

# KNOWN ISSUE (B5): DEBUG/TRACE logging and show-sql apply to every environment, including Kubernetes.
logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    com.nexusrtc: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.org.hibernate.jpa: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.web.cors: TRACE
    org.springframework.security: DEBUG