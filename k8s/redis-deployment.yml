apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-rtc-redis
  labels:
    app: nexus-rtc
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-rtc
      component: redis
  template:
    metadata:
      labels:
        app: nexus-rtc
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis-port
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-rtc-redis-service
  labels:
    app: nexus-rtc
    component: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: nexus-rtc
    component: redis
  type: ClusterIP
