apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-rtc-app-ingress
  labels:
    app: nexus-rtc
  annotations:
    # Deprecated annotation; ingressClassName below already selects the class
    kubernetes.io/ingress.class: "nginx"
    
    # Upload size limit and long timeouts for WebSocket connections
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # KNOWN ISSUE (I1): websocket-services is an NGINX Inc annotation with no effect in ingress-nginx,
    # which proxies WebSockets without it. ingress-nginx itself was retired in March 2026.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "nexus-rtc-backend-service"

    # Cookie affinity. Not required: auth is stateless JWT and Redis handles cross-pod delivery (I2).
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "balanced"
    nginx.ingress.kubernetes.io/session-cookie-name: "NEXUS_RTC_AFFINITY"
    nginx.ingress.kubernetes.io/session-cookie-expires: "14400"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "14400"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
spec:
  ingressClassName: nginx
  rules:
    - host: jenkins.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-rtc-jenkins-service
                port:
                  number: 8888
    - host: nexus-rtc.localhost
      http:
        paths:
          # WebSocket (STOMP) endpoint
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nexus-rtc-backend-service
                port:
                  number: 8080
          # REST API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexus-rtc-backend-service
                port:
                  number: 8080
          # Frontend static assets
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-rtc-frontend-service
                port:
                  number: 80
    # KNOWN ISSUE (I6): MinIO console and S3 API exposed through the ingress with dev credentials
    - host: storage-ui.nexus-rtc.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9001
    - host: storage.nexus-rtc.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
