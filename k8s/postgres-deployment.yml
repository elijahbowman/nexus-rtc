apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  labels:
    app: nexus-rtc
    component: database
spec:
  replicas: 1
  # Strategy Recreate prevents multi-pod volume locking collision anomalies
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus-rtc
      component: database
  template:
    metadata:
      labels:
        app: nexus-rtc
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: db-port
        env:
          # Pull public non-sensitive attributes out of the global ConfigMap
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: POSTGRES_USER
          # Pull highly confidential keys cleanly from Opaque Secret wrapper
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nexus-rtc-app-secrets
                key: postgres-password
        volumeMounts:
          # Mount the physical data directory path straight inside the box
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      volumes:
            # Bind the storage box hook onto cluster PVC manifest asset
            - name: postgres-storage
              persistentVolumeClaim:
                claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db-service  # Matches DB host variable inside backend deployment config
  labels:
    app: nexus-rtc
    component: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: nexus-rtc
    component: database
  type: ClusterIP
