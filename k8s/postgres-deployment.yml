apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  labels:
    app: nexus-rtc
    component: database
spec:
  replicas: 1
  # Recreate: the RWO volume can't be mounted by old and new pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus-rtc
      component: database
  template:
    metadata:
      labels:
        app: nexus-rtc
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: db-port
        env:
          # Non-secret config
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: POSTGRES_USER
          # Password from the Secret
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nexus-rtc-app-secrets
                key: postgres-password
        volumeMounts:
          # Data directory
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      volumes:
            # PVC
            - name: postgres-storage
              persistentVolumeClaim:
                claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db-service  # Referenced by SPRING_DATASOURCE_URL
  labels:
    app: nexus-rtc
    component: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: nexus-rtc
    component: database
  type: ClusterIP
