apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: rtc-project
    component: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rtc-project
      component: storage
  template:
    metadata:
      labels:
        app: rtc-project
        component: storage
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: s3-api
            - containerPort: 9001
              name: web-console
          env:
            # Public Root Username handle pulled from core ConfigMap
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: rtc-app-config
                  key: AWS_ACCESS_KEY_ID
            # Sensitive Root Password token pulled from cluster Secrets
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rtc-app-secrets
                  key: minio-root-password
          volumeMounts:
            # Mounts the permanent 5Gi file-system slice to prevent data drop anomalies
            - name: minio-storage
              mountPath: /data
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  labels:
    app: rtc-project
    component: storage
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: s3-api
    - port: 9001
      targetPort: 9001
      name: web-console
  selector:
    app: rtc-project
    component: storage
  type: ClusterIP
