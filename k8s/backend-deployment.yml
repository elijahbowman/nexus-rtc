apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-rtc-backend
  labels:
    app: nexus-rtc
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexus-rtc
      component: backend
  template:
    metadata:
      labels:
        app: nexus-rtc
        component: backend
    spec:
      # InitContainer prevents application pods from crashing if the database is still initializing
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for postgres-db-service to listen on port 5432...";
              until nc -z -w 2 postgres-db-service 5432; do sleep 2; done;
              echo "Database layer detected! Booting application microservice...";
      containers:
      - name: backend
        # KNOWN ISSUE (P1): Jenkins builds rtc-backend:latest, but this uses nexus-rtc-backend:latest, so
        # pipeline builds are never deployed. Images are loaded manually with `minikube image load`.
        image: nexus-rtc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: api-port
        env:
          # Non-secret config from the ConfigMap
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: SPRING_DATASOURCE_URL
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: POSTGRES_USER
          - name: SPRING_DATA_REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: SPRING_DATA_REDIS_HOST
          - name: SPRING_DATA_REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: SPRING_DATA_REDIS_PORT
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: AWS_ACCESS_KEY_ID
          - name: MINIO_URL
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: MINIO_URL
          - name: MINIO_BUCKET_NAME
            valueFrom:
              configMapKeyRef:
                name: nexus-rtc-app-config
                key: MINIO_BUCKET_NAME
          
          # Secrets (base64-encoded, not encrypted)
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nexus-rtc-app-secrets
                key: postgres-password
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: nexus-rtc-app-secrets
                key: minio-root-password
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: nexus-rtc-app-secrets
                key: jwt-secret

        # TCP probes only check that the port is open. KNOWN ISSUE (B9): use Actuator liveness/readiness.
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 95
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 85
          periodSeconds: 15

        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"

      hostAliases:
        # KNOWN ISSUE (B7): pins the ingress controller's ClusterIP so the backend can presign URLs for
        # storage.nexus-rtc.localhost. The IP differs per cluster and must be updated by hand.
        # - ip: "10.104.71.86"
        - ip: "10.101.60.142" # ingress-nginx-controller CLUSTER-IP retrieved by running `kubectl get svc -n ingress-nginx ingress-nginx-controller`
          hostnames:
            - "storage.nexus-rtc.localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-rtc-backend-service
  labels:
    app: nexus-rtc
    component: backend
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: nexus-rtc
    component: backend
  # Internal only; external traffic arrives through the Ingress
  type: ClusterIP
