apiVersion: v1
kind: ConfigMap
metadata:
  name: rtc-app-config
  labels:
    app: rtc-portfolio
data:
  # Database Configuration
  POSTGRES_DB: "realtime_communication_db"
  POSTGRES_USER: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db-service:5432/realtime_communication_db"
  
  # Redis Cluster Service Ingress
  SPRING_DATA_REDIS_HOST: "rtc-redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  
  # MinIO S3 API Endpoint and Bucket Routing
  AWS_ACCESS_KEY_ID: "devuser"
  MINIO_URL: "http://storage.nexus-rtc.localhost"
  MINIO_BUCKET_NAME: "nexus-rtc-attachments"
