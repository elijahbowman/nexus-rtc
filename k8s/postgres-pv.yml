apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-db-pv
  labels:
    app: nexus-rtc
    component: database
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # Keep data if the PVC is deleted
  storageClassName: postgres-manual-storage
  hostPath:
    path: /data/postgres-permanent-storage # hostPath on the node (single-node dev only)
    type: DirectoryOrCreate