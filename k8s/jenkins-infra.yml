apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-home-pv
  labels:
    app: nexus-rtc
    component: cicd
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # Keep data if the PVC is deleted
  storageClassName: manual-storage
  hostPath:
    path: /data/jenkins-permanent-home # hostPath on the node
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home-pvc
  labels:
    app: nexus-rtc
    component: cicd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-storage # Binds to the static PV above
  resources:
    requests:
      storage: 5Gi  # Maven and npm caches
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-admin-sa
  namespace: default
  labels:
    app: nexus-rtc
    component: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-admin-rbac
  labels:
    app: nexus-rtc
    component: cicd
subjects:
  - kind: ServiceAccount
    name: jenkins-admin-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin # KNOWN ISSUE (P5): scope to a namespaced Role that can only update deployments
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-rtc-jenkins-server
  labels:
    app: nexus-rtc
    component: cicd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: jenkins-controller
  template:
    metadata:
      labels:
        component: jenkins-controller
    spec:
      serviceAccountName: jenkins-admin-sa
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          imagePullPolicy: IfNotPresent
          # KNOWN ISSUE (P5): privileged + root. Combined with docker.sock and cluster-admin, any pipeline
          # change gets full control of the node and cluster. Use Kaniko or rootless BuildKit instead.
          securityContext:
            runAsUser: 0
            privileged: true
          ports:
            - containerPort: 8080
              name: web-port
            - containerPort: 50000
              name: agent-port
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=true"
          command:
            - /bin/sh
            - -c
            - |
              echo "Configuring cluster environment directory exception rules..."
              # Mark the workspace as a git safe.directory (ownership differs in the container)
              git config --global --add safe.directory '*'
              
              echo "Installing core pipeline execution requirements..."
              apt-get update && apt-get install -y libatomic1 docker.io
              
              echo "Downloading and installing native cluster kubectl binaries..."
              # KNOWN ISSUE (P2): amd64 kubectl in an arm64 container; runs only via Docker Desktop's x86 emulation.
              curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
              chmod +x /usr/local/bin/kubectl
              
              echo "Environment verification check:"
              kubectl version --client
              
              echo "Initialization complete. Initializing Jenkins daemon..."
              
              echo "Environment provisioning completed successfully! Booting Jenkins master daemon..."
              exec /usr/local/bin/jenkins.sh
          volumeMounts:
            - name: jenkins-home-volume
              mountPath: /var/jenkins_home
            # Mounts the node's Docker socket (see P5)
            - name: docker-socket
              mountPath: /var/run/docker.sock
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jenkins-home-volume
          persistentVolumeClaim:
            claimName: jenkins-home-pvc
        # Node's Docker socket
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-rtc-jenkins-service
  labels:
    app: nexus-rtc
    component: cicd
spec:
  ports:
    - port: 8888
      targetPort: 8080
      name: http
    - port: 50000
      targetPort: 50000
      name: agent
  selector:
    component: jenkins-controller
  type: ClusterIP