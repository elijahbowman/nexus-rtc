apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-rtc-frontend
  labels:
    app: nexus-rtc
    component: frontend
spec:
  # Two replicas for availability during rollouts
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexus-rtc
      component: frontend
  template:
    metadata:
      labels:
        app: nexus-rtc
        component: frontend
    spec:
      containers:
      - name: frontend
        image: nexus-rtc-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http-port
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-rtc-frontend-service
  labels:
    app: nexus-rtc
    component: frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: nexus-rtc
    component: frontend
  # Internal only; external traffic arrives through the Ingress
  type: ClusterIP
