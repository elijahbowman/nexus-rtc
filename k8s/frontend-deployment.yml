apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtc-frontend
  labels:
    app: rtc-portfolio
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rtc-portfolio
      component: frontend
  template:
    metadata:
      labels:
        app: rtc-portfolio
        component: frontend
    spec:
      containers:
      - name: frontend
        image: realtime-communication-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: web-port
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rtc-frontend-service
  labels:
    app: rtc-portfolio
    component: frontend
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: rtc-portfolio
    component: frontend
  type: LoadBalancer
